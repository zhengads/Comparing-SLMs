[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comparing-slms"
version = "0.1.0"
description = "Reproducible small language model and frozen representation experiments"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "numpy>=1.26,<2", "scipy>=1.13,<2", "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4"]

[project.scripts]
core = "core.cli:main"

[tool.setuptools.packages.find]
include = ["core*"]
